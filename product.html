<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maison Luxe — Product Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a;
    --cream:#f4f1ec;
    --paper:#faf8f4;
    --gold:#b89968;
    --muted:#8a8378;
    --line:#e3ddd2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:400;letter-spacing:.5px}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}

  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:22px 5%;background:rgba(250,248,244,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:4px;text-transform:uppercase}
  .brand span{color:var(--gold)}
  .nav-links{display:flex;gap:36px;font-size:12px;letter-spacing:2px;text-transform:uppercase}
  .nav-links a:hover{color:var(--gold)}

  .breadcrumb{padding:120px 5% 0;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .breadcrumb a:hover{color:var(--gold)}

  .product-wrap{display:grid;grid-template-columns:1fr 1fr;gap:60px;padding:40px 5% 80px;align-items:start}
  .product-img{background:var(--cream);aspect-ratio:1/1;overflow:hidden}
  .product-img img{width:100%;height:100%;object-fit:cover}

  .product-info .cat{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:block}
  .product-info h1{font-size:clamp(32px,4vw,48px);margin-bottom:16px;line-height:1.1}
  .product-info .price{font-size:22px;color:var(--gold);margin-bottom:28px;letter-spacing:1px}
  .product-info .desc{color:var(--muted);margin-bottom:32px;font-size:15px}

  .specs{border-top:1px solid var(--line);padding-top:24px;margin-bottom:32px}
  .spec-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .spec-row .label{color:var(--muted)}

  .btn{display:inline-block;padding:16px 42px;background:var(--ink);color:var(--paper);font-size:12px;letter-spacing:3px;text-transform:uppercase;transition:all .35s;cursor:pointer;border:none}
  .btn:hover{background:var(--gold)}
  .btn-outline{background:transparent;color:var(--ink);border:1px solid var(--ink);margin-left:10px}
  .btn-outline:hover{background:var(--ink);color:var(--paper)}

  .related{padding:60px 5%;background:var(--cream)}
  .related h2{text-align:center;font-size:32px;margin-bottom:40px}
  .related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:28px}
  .rel-card{cursor:pointer}
  .rel-img{aspect-ratio:1/1;background:var(--paper);overflow:hidden;margin-bottom:12px}
  .rel-img img{width:100%;height:100%;object-fit:cover}
  .rel-name{font-family:'Cormorant Garamond',serif;font-size:18px}
  .rel-price{font-size:13px;color:var(--gold);margin-top:4px}

  @media(max-width:820px){
    .product-wrap{grid-template-columns:1fr;gap:30px}
    .nav-links{display:none}
  }
</style>
</head>
<body>

<nav>
  <div class="brand">Maison<span>·</span>Luxe</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="index.html#collections">Collections</a>
    <a href="index.html#story">Our Story</a>
    <a href="index.html#contact">Wholesale Inquiry</a>
  </div>
</nav>

<div class="breadcrumb">
  <a href="index.html">Home</a> / <a href="index.html#collections">Collections</a> / <span id="bc-name">Product</span>
</div>

<div class="product-wrap">
  <div class="product-img"><img id="main-img" src="" alt=""></div>
  <div class="product-info">
    <span class="cat" id="p-cat"></span>
    <h1 id="p-name"></h1>
    <div class="price" id="p-price"></div>
    <p class="desc" id="p-desc"></p>
    <div class="specs">
      <div class="spec-row"><span class="label">Category</span><span id="p-cat2"></span></div>
      <div class="spec-row"><span class="label">US Sizes</span><span>US 5 – 13</span></div>
      <div class="spec-row"><span class="label">MOQ</span><span>50 pairs per colorway</span></div>
      <div class="spec-row"><span class="label">Lead Time</span><span>30 days for samples</span></div>
      <div class="spec-row"><span class="label">Shipping</span><span>FOB Guangzhou / Shenzhen</span></div>
    </div>
    <a class="btn" id="inquire-btn" href="index.html#contact">Inquire About This Product</a>
    <a class="btn btn-outline" href="index.html#collections">Back to Collection</a>
  </div>
</div>

<section class="related">
  <h2>You May Also Like</h2>
  <div class="related-grid" id="related-grid"></div>
</section>

<script>
const products = [
  {id:1, name:"The Court White", cat:"Leather", price:"USD 50", img:"shoe1.jpg",
   desc:"Minimalist low-top court sneaker in premium smooth leather. Clean silhouette, cushioned footbed, and a durable rubber outsole. A timeless everyday staple designed for the US market."},
  {id:2, name:"Executive Black", cat:"Leather", price:"USD 52", img:"shoe2.jpg",
   desc:"Sleek black leather sneaker with a refined profile. Pairs well with both business casual and weekend looks. Full-grain upper with a breathable lining."},
  {id:3, name:"Mocha Low", cat:"Suede", price:"USD 55", img:"shoe3.jpg",
   desc:"Soft suede low-top in warm mocha tone. Premium Portuguese suede upper, memory foam insole, and a lightweight cupsole."},
  {id:4, name:"Taupe Runner", cat:"Suede", price:"USD 55", img:"shoe4.jpg",
   desc:"Taupe suede runner with retro-inspired lines. Mixed material upper, EVA midsole for all-day comfort, and a textured rubber outsole."},
  {id:5, name:"Ecru Deck", cat:"Canvas", price:"USD 50", img:"shoe5.jpg",
   desc:"Heavyweight Japanese canvas deck shoe in natural ecru. Vulcanized sole, cotton laces, and a breathable unlined upper — perfect for warm climates."},
  {id:6, name:"Ink Striped", cat:"Canvas", price:"USD 50", img:"shoe6.jpg",
   desc:"Ink-blue canvas sneaker with subtle stripe detail. Clean, casual, and versatile. Cotton canvas upper with a natural rubber foxing."},
  {id:7, name:"980 Vintage", cat:"Retro Runner", price:"USD 55", img:"shoe7.jpg",
   desc:"Inspired by late-90s running silhouettes. Layered mesh and suede upper, ABZORB-style cushioning, and a sculpted waffle outsole."},
  {id:8, name:"Gravel Trail", cat:"Retro Runner", price:"USD 55", img:"shoe8.jpg",
   desc:"Trail-inspired runner with rugged outsole lugs. Breathable mesh upper, supportive heel counter, and a reactive EVA midsole."}
];

const params = new URLSearchParams(window.location.search);
const id = parseInt(params.get('id')) || 1;
const p = products.find(x => x.id === id) || products[0];

document.title = "Maison Luxe — " + p.name;
document.getElementById('bc-name').textContent = p.name;
document.getElementById('main-img').src = p.img;
document.getElementById('main-img').alt = p.name;
document.getElementById('p-cat').textContent = p.cat;
document.getElementById('p-cat2').textContent = p.cat;
document.getElementById('p-name').textContent = p.name;
document.getElementById('p-price').textContent = p.price;
document.getElementById('p-desc').textContent = p.desc;

// Pre-fill inquiry form with product name
document.getElementById('inquire-btn').href = "index.html#contact?product=" + encodeURIComponent(p.name);

// Related products (other 4)
const related = products.filter(x => x.id !== id).slice(0, 4);
const grid = document.getElementById('related-grid');
related.forEach(r => {
  grid.innerHTML += `
    <a class="rel-card" href="product.html?id=${r.id}">
      <div class="rel-img"><img src="${r.img}" alt="${r.name}"></div>
      <div class="rel-name">${r.name}</div>
      <div class="rel-price">${r.price}</div>
    </a>`;
});
</script>
</body>
</html>
