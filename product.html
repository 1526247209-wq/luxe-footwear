const params = new URLSearchParams(window.location.search);
const id = parseInt(params.get('id')) || 1;
const p = products.find(x => x.id === id) || products[0];

document.title = "Maison Luxe — " + p.name;
document.getElementById('bc-name').textContent = p.name;
document.getElementById('main-img').src = p.images[0];
document.getElementById('main-img').alt = p.name;
document.getElementById('p-cat').textContent = p.cat;
document.getElementById('p-cat2').textContent = p.cat;
document.getElementById('p-name').textContent = p.name;
document.getElementById('p-price').textContent = p.price;
document.getElementById('p-desc').textContent = p.desc;

// Build thumbnail gallery
const thumbsEl = document.getElementById('thumbs');
p.images.forEach((img, i) => {
  thumbsEl.innerHTML += `<img src="${img}" alt="${p.name} view ${i+1}" class="${i===0?'active':''}" onclick="changeImg('${img}', this)">`;
});
function changeImg(src, el) {
  document.getElementById('main-img').src = src;
  document.querySelectorAll('.thumbs img').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

// Pre-fill inquiry form with product name
document.getElementById('inquire-btn').href = "index.html?product=" + encodeURIComponent(p.name) + "#contact";

// Related products
const related = products.filter(x => x.id !== id);
const grid = document.getElementById('related-grid');
related.forEach(r => {
  grid.innerHTML += `
    <a class="rel-card" href="product.html?id=${r.id}">
      <div class="rel-img"><img src="${r.images[0]}" alt="${r.name}"></div>
      <div class="rel-name">${r.name}</div>
      <div class="rel-price">${r.price}</div>
    </a>`;
});
</script>
